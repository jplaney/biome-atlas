name: Deploy Biome Atlas

on:
  push:
    branches: [main]          # code change → deploy committed files immediately
  schedule:
    - cron: "0 6 * * *"       # 06:00 UTC daily → refresh today.json, then deploy
  workflow_dispatch:          # manual run also refreshes

permissions:
  contents: write             # scheduled run commits the refreshed today.json
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # --- Live refresh ONLY on schedule / manual, never on a push ---
      # Pushes skip this entirely, so a code change deploys instantly instead of
      # waiting on ~224 Open-Meteo calls that get rate-limited on shared CI IPs.
      - name: Set up Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh today.json (live forecasts)
        if: github.event_name != 'push'
        run: python3 -m pipeline.build_today || echo "build_today had issues; keeping committed today.json"

      - name: Commit refreshed snapshot
        if: github.event_name != 'push'
        continue-on-error: true           # a failed commit/push must not block the deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/processed/today.json; then
            echo "today.json unchanged — nothing to commit"
          else
            git add data/processed/today.json
            git commit -m "chore: refresh today.json [skip ci]"
            git push
          fi

      # --- Assemble + deploy (always) ---
      # Uses today.json on disk: the committed one on a push, the freshly built
      # one on a scheduled/manual run.
      - name: Assemble site
        run: |
          mkdir -p _site/data/processed
          cp web/index.html web/app.js web/style.css _site/
          cp data/processed/biomes.geojson data/processed/stats.json data/processed/today.json _site/data/processed/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
